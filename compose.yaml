services:
  db:
    image: postgres:17-alpine
    # Defaults so the stack comes up with no setup, overridable from a .env file or the environment
    # without editing a tracked file. The defaults are throwaway local values, not secrets.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraudengine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraudengine}
      POSTGRES_DB: ${POSTGRES_DB:-fraudengine}
    # The host port is overridable because 5432 is often already taken by a PostgreSQL installed on the
    # machine. Set POSTGRES_PORT to something free and connect a client to that instead.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The api waits on this rather than on the container merely existing, because Postgres accepts
    # connections a few seconds after the process starts.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudengine -d fraudengine"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: final
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Development, so migrations are applied on boot and the OpenAPI document and its browsable
      # reference are served. Production applies migrations as a separate step.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-fraudengine};Username=${POSTGRES_USER:-fraudengine};Password=${POSTGRES_PASSWORD:-fraudengine}"
      # Stated here rather than left to the shipped development settings, so it is visible where the
      # key comes from and can be replaced without rebuilding.
      ApiKey__Keys__dev-local-key-0123456789: local-development
    ports:
      - "8080:8080"

  tests:
    build:
      context: .
      target: test
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Set, so the integration tests use this database rather than starting one through
      # Testcontainers, which is what happens when the variable is absent.
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-fraudengine};Username=${POSTGRES_USER:-fraudengine};Password=${POSTGRES_PASSWORD:-fraudengine}"
    # Only runs when asked for by name, so `docker compose up` does not start it.
    profiles:
      - test

  # A browser based way to look at the stored data, for anyone who would rather not use psql. It reaches
  # the database over the compose network, so it works regardless of what is installed on the host and
  # regardless of which host port the database is published on.
  pgadmin:
    image: dpage/pgadmin4:9.17
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@fraudengine.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-fraudengine}
      # No login screen and no master password, because this is a local inspection tool and a
      # credential prompt in front of a throwaway database is friction with nothing behind it.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      # The connection arrives already registered, so there is nothing to fill in but the password.
      - ./docs/pgadmin-servers.json:/pgadmin4/servers.json:ro
      - pgadmin:/var/lib/pgadmin
    profiles:
      - tools

volumes:
  pgdata:
  pgadmin:
