name: build

# Every push and every pull request, so a change is verified on a clean machine rather than only on
# whichever laptop it was written on.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a superseded run rather than paying for a result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # The integration tests take a database from ConnectionStrings__Default when it is set, which is this
    # path and the compose path. Left unset they start one themselves, which is the path from an editor.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fraudengine
          POSTGRES_USER: fraudengine
          POSTGRES_PASSWORD: fraudengine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username fraudengine --dbname fraudengine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      # Pinned from global.json, so the runner uses the same SDK the solution is built with locally.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Release, because that is what ships. Warnings are already errors through Directory.Build.props,
      # so an analyser complaint fails here rather than being scrolled past locally.
      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Separately from the integration tests, so a red run says which kind broke without being read.
      - name: Unit tests
        run: dotnet test UnitTests.slnf --configuration Release --no-build

      - name: Integration tests
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=fraudengine;Username=fraudengine;Password=fraudengine"
        run: dotnet test tests/FraudRuleEngine.IntegrationTests --configuration Release --no-build

      # The test stage as well as the runtime one. It is not on the path to the runtime image, so
      # building only that would leave the tests the image runs unverified.
      - name: Build the container image
        run: |
          docker build --target test --tag fraud-rule-engine:ci-tests .
          docker build --target final --tag fraud-rule-engine:ci .
